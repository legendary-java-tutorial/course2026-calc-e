<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор</title>
</head>
<body>
  <h1>Калькулятор</h1>

  <input id="a" type="number" placeholder="Первое число">
  <input id="b" type="number" placeholder="Второе число">

  <button id="add">+</button>
  <button id="subtract">−</button>
  <button id="multiply">×</button>

  <p>Результат: <output id="result"></output></p>

  <script src="calc.js"></script>
  <script>
    const inputA = document.getElementById('a');
    const inputB = document.getElementById('b');
    const result = document.getElementById('result');

    document.getElementById('add').addEventListener('click', () => {
      result.textContent = add(Number(inputA.value), Number(inputB.value));
    });

    document.getElementById('subtract').addEventListener('click', () => {
      result.textContent = subtract(Number(inputA.value), Number(inputB.value));
    });

    document.getElementById('multiply').addEventListener('click', () => {
      result.textContent = multiply(Number(inputA.value), Number(inputB.value));
    });
  </script>
</body>
</html>
